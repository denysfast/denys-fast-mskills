name: CodeQL
on:
  push:
    branches: [main]
    paths: ['**.py', '.github/workflows/codeql.yml']
  schedule:
    - cron: '15 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Only the maintained default branch executes on the private runner network.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
