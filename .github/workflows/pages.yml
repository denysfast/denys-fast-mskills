name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    # Never run untrusted pull requests on the private runner network.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages requires a temporary upload to its publishing API. The source
      # remains in Git; remove the transfer artifact after a successful deploy.
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: docs
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Remove the published transfer artifact
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteArtifact({
              ...context.repo,
              artifact_id: Number('${{ steps.artifact.outputs.artifact_id }}')
            });
